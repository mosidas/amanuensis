# GitHub Actions の uses: に固定したコミット SHA と SwiftPM の依存の更新 PR を Dependabot に作らせる設定。
# 選択肢の一覧: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action の init と analyze は同じ版でないと analyze が失敗する(PR #2・#3 で CI が落ちた)
      codeql-action:
        patterns:
          - "github/codeql-action"
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
